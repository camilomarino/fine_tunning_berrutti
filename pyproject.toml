[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fine-tunne-berrutti"
version = "0.1.0"
description = "Fine-tuning job preparation for Ruche and ClusterUY, with Berrutti OCR recipes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyascii==0.3.3",
  "rapidfuzz>=3.13,<4",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
monitor = ["websockets>=16,<17"]
dev = ["ruff>=0.12,<0.13"]

[project.scripts]
berrutti-data = "data.manage:main"
archive-berrutti = "archive_berrutti.cli:main"

[tool.setuptools.packages.find]
include = ["experiments*", "archive_berrutti", "data", "data.preparation", "finetune*", "evaluation", "reporting*"]
namespaces = true

[tool.setuptools.package-data]
data = ["catalog.json", "import.sbatch", "*.md", "*/README.md", "berrutti_175/split-v1.json"]
"data.preparation" = ["README.md"]
archive_berrutti = ["prepare.sbatch", "*.md"]
"finetune.recipes.berrutti_qwen38" = ["*.sbatch", "README.md"]
"reporting.berrutti" = ["web/*.html", "web/*.js", "web/*.css", "web/README.md", "ocr_diff_web/*.js", "ocr_diff_web/*.css"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
